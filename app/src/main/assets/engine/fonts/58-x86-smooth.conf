<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>x86-in-android: smooth TrueType, no embedded bitmaps</description>
  <!-- Ban pixel/bitmap strikes; force grayscale + LCD antialiasing (ClearType-like). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
  <!-- Prefer scalable outlines over bitmap faces when both exist. -->
  <selectfont>
    <rejectfont>
      <pattern>
        <patelt name="outline"><bool>false</bool></patelt>
      </pattern>
    </rejectfont>
  </selectfont>
  <!-- Bitmap / DOS-era family names → Wine's scalable Tahoma / Courier New. -->
  <alias binding="same"><family>MS Sans Serif</family><prefer><family>Tahoma</family></prefer></alias>
  <alias binding="same"><family>MS Serif</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias binding="same"><family>MS Shell Dlg</family><prefer><family>Tahoma</family></prefer></alias>
  <alias binding="same"><family>MS Shell Dlg 2</family><prefer><family>Tahoma</family></prefer></alias>
  <alias binding="same"><family>System</family><prefer><family>Tahoma</family></prefer></alias>
  <alias binding="same"><family>Fixedsys</family><prefer><family>Courier New</family></prefer></alias>
  <alias binding="same"><family>Terminal</family><prefer><family>Courier New</family></prefer></alias>
  <alias binding="same"><family>Small Fonts</family><prefer><family>Tahoma</family></prefer></alias>
  <alias binding="same"><family>Courier</family><prefer><family>Courier New</family></prefer></alias>
</fontconfig>
