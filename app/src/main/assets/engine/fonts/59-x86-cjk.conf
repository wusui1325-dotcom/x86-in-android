<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>x86-in-android CJK aliases (Noto Sans CJK; Traditional first)</description>
  <dir>/usr/share/fonts/opentype/noto</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>/home/xuser/.wine/drive_c/windows/Fonts</dir>

  <!-- Default CJK sans: Traditional Chinese first, then Simplified. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans CJK HK</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Sans CJK TC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK TC</family>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

  <!-- Traditional aliases -->
  <alias binding="same"><family>Microsoft JhengHei</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>Microsoft JhengHei UI</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>微軟正黑體</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>微軟正黑體 UI</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>MingLiU</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>PMingLiU</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>MingLiU_HKSCS</family><prefer><family>Noto Sans CJK HK</family></prefer></alias>
  <alias binding="same"><family>PMingLiU-ExtB</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>MingLiU-ExtB</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>新細明體</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>細明體</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>DFKai-SB</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>
  <alias binding="same"><family>標楷體</family><prefer><family>Noto Sans CJK TC</family></prefer></alias>

  <!-- Simplified aliases (still covered; SC face for proper glyphs) -->
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimSun-ExtB</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei UI</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>黑体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>楷体</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>仿宋</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>等线</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
</fontconfig>
